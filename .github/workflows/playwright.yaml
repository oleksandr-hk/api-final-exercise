name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: dojo_api
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:test@127.0.0.1:3306/dojo_api
      JWT_SECRET: ci-test-secret-at-least-32-characters-long
      UPLOAD_DIR: ./uploads
      ADMIN_NAME: Admin User
      ADMIN_EMAIL: admin@dojo.api
      ADMIN_PASSWORD: Password1
      BASE_URL: http://127.0.0.1:3000
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -uroot -ptest --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Create uploads directory
        run: mkdir -p uploads

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push database schema
        run: npm run db:push

      - name: Seed database
        run: npm run db:seed

      - name: Start application
        run: npm run dev -- --hostname 127.0.0.1 > /tmp/dojo-api-server.log 2>&1 &

      - name: Wait for application
        run: |
          for attempt in {1..30}; do
            if curl --silent --output /dev/null "$BASE_URL/api/oauth/userinfo"; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/dojo-api-server.log
          exit 1

      - name: Run API tests
        run: npm test

      - name: Upload Playwright HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload application log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: application-log
          path: /tmp/dojo-api-server.log
          retention-days: 7
          if-no-files-found: ignore
